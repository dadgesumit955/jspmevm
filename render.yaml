services:
  - type: web
    name: sae-student-election
    runtime: python
    plan: free
    buildCommand: ""
    startCommand: python server.py
    healthCheckPath: /
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: TURSO_URL
        sync: false
      - key: TURSO_TOKEN
        sync: false